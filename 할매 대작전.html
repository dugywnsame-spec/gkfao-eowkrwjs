<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>할매 대작전</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Jua&display=swap">
<style>
/* layout: 화면 전체를 쓰는 캔버스 게임 한 장. HUD는 캔버스 안에서 모서리 16px 이상 띄워 그린다. */
:root{
  --bg:#17120c;       /* 해 질 녘 흙마당 */
  --ink:#fff6e0;      /* 창호지 */
  --kimchi:#e0312b;   /* 고무장갑 빨강 */
  --cabbage:#cfe88a;  /* 배추 속잎 */
  --won:#7dff8c;      /* 소지금 */
  --gold:#ffd23f;     /* 목표 표시 */
  --display:'Black Han Sans','Noto Sans CJK KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  --ui:'Jua','Noto Sans CJK KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--ui);overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
#g{display:block;width:100%;height:100%;outline:none;cursor:pointer}
</style>
<canvas id="g" tabindex="0" aria-label="할매 대작전 게임 화면"></canvas>
<script>
(()=>{
'use strict';
const cv=document.getElementById('g'),c=cv.getContext('2d');
const css=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const COL={ink:css('--ink'),kim:css('--kimchi'),cab:css('--cabbage'),won:css('--won'),gold:css('--gold')};
const FD=css('--display'),FU=css('--ui');
let VW=1280,VH=720,SC=1,DPR=1;
function resize(){const r=cv.getBoundingClientRect();DPR=Math.min(window.devicePixelRatio||1,2);cv.width=Math.max(2,r.width*DPR);cv.height=Math.max(2,r.height*DPR);
  if(r.width>=r.height){VH=720;SC=cv.height/720;VW=cv.width/SC}else{VW=720;SC=cv.width/720;VH=cv.height/SC}}
addEventListener('resize',resize);resize();

/* ---------- 유틸 ---------- */
const PI=Math.PI,TAU=PI*2;
const clamp=(v,a,b)=>v<a?a:v>b?b:v,lerp=(a,b,t)=>a+(b-a)*t;
const dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
const angd=(a,b)=>{let d=(a-b)%TAU;if(d>PI)d-=TAU;if(d<-PI)d+=TAU;return d};
let seed=7;const rs=()=>{seed=(seed*16807)%2147483647;return seed/2147483647};
const rnd=(a,b)=>a+Math.random()*(b-a);
const circ=(x,y,r)=>{c.beginPath();c.arc(x,y,r,0,TAU);c.fill()};
const ring=(x,y,r)=>{c.beginPath();c.arc(x,y,r,0,TAU);c.stroke()};
const line=(a,b,d,e)=>{c.beginPath();c.moveTo(a,b);c.lineTo(d,e);c.stroke()};
function rr(x,y,w,h,r){c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath()}
function txt(s,x,y,size,col,al,font,stroke){c.font=size+'px '+(font||FU);c.textAlign=al||'left';c.textBaseline='middle';
  if(stroke){c.lineJoin='round';c.lineWidth=stroke;c.strokeStyle='rgba(0,0,0,.85)';c.strokeText(s,x,y)}c.fillStyle=col||'#fff';c.fillText(s,x,y)}
function wrap(s,maxW,size,font){c.font=size+'px '+(font||FU);const out=[];let cur='';for(const ch of s){if(ch==='\n'){out.push(cur);cur='';continue}
  if(c.measureText(cur+ch).width>maxW&&cur){const i=cur.lastIndexOf(' ');if(i>cur.length*0.5){out.push(cur.slice(0,i));cur=cur.slice(i+1)+ch}else{out.push(cur);cur=ch}}else cur+=ch}
  if(cur)out.push(cur);return out}
const tk=s=>isTouch?s.replace(/\[Space\]/g,'[공격]').replace(/\[Shift\]/g,'[특수]'):s;
const won=n=>'₩'+(n<0?'-':'')+Math.abs(n).toLocaleString('en-US');

/* ---------- 입력 ---------- */
const key={},jp={};let joy=null,isTouch=false;const ptrs=new Map();
const KM={ArrowUp:'up',KeyW:'up',ArrowDown:'down',KeyS:'down',ArrowLeft:'left',KeyA:'left',ArrowRight:'right',KeyD:'right',Space:'a',KeyJ:'a',ShiftLeft:'b',ShiftRight:'b',KeyK:'b',KeyE:'e',Enter:'e',KeyR:'r',KeyM:'m'};
addEventListener('keydown',e=>{const k=KM[e.code];if(!k)return;e.preventDefault();audio();if(!key[k])jp[k]=true;key[k]=true});
addEventListener('keyup',e=>{const k=KM[e.code];if(k)key[k]=false});
addEventListener('blur',()=>{for(const k in key)key[k]=false});
const lp=e=>{const r=cv.getBoundingClientRect();return{x:(e.clientX-r.left)*DPR/SC,y:(e.clientY-r.top)*DPR/SC}};
const btns=()=>[{k:'a',x:VW-92,y:VH-104,r:54,l:'공격'},{k:'b',x:VW-204,y:VH-70,r:38,l:'특수'},{k:'e',x:VW-84,y:VH-226,r:36,l:'E'}];
let tapPos=null;
cv.addEventListener('pointerdown',e=>{e.preventDefault();cv.focus();audio();const p=lp(e);tapPos=p;
  if(e.pointerType==='touch'){isTouch=true;
    if(mode==='play'||mode==='fight'){for(const b of btns())if(Math.hypot(p.x-b.x,p.y-b.y)<b.r+10){ptrs.set(e.pointerId,b.k);if(!key[b.k])jp[b.k]=true;key[b.k]=true;return}
      if(D){jp.a=true;return}
      if(p.x<VW*0.55){ptrs.set(e.pointerId,'joy');joy={ox:p.x,oy:p.y,x:0,y:0};return}}
    jp.a=true;jp.tap=true}
  else{jp.a=true;jp.tap=true}});
cv.addEventListener('pointermove',e=>{if(ptrs.get(e.pointerId)==='joy'&&joy){const p=lp(e);let dx=p.x-joy.ox,dy=p.y-joy.oy;const m=Math.hypot(dx,dy);if(m>60){dx*=60/m;dy*=60/m}joy.x=dx/60;joy.y=dy/60}});
const pup=e=>{const k=ptrs.get(e.pointerId);if(k==='joy')joy=null;else if(k)key[k]=false;ptrs.delete(e.pointerId)};
cv.addEventListener('pointerup',pup);cv.addEventListener('pointercancel',pup);
cv.addEventListener('contextmenu',e=>e.preventDefault());
function axis(){let x=(key.right?1:0)-(key.left?1:0),y=(key.down?1:0)-(key.up?1:0);if(joy&&Math.hypot(joy.x,joy.y)>.18){x=joy.x;y=joy.y}const m=Math.hypot(x,y);if(m>1){x/=m;y/=m}return{x,y,m:Math.min(m,1)}}

/* ---------- 소리 ---------- */
let AC=null,mute=false;
function audio(){if(AC)return;try{AC=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}}
function snd(f,d=.08,type='square',v=.05,slide=0){if(!AC||mute)return;try{const o=AC.createOscillator(),g=AC.createGain(),t=AC.currentTime;o.type=type;o.frequency.setValueAtTime(f,t);
  if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,f+slide),t+d);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+d)}catch(e){}}
const S={pick:()=>{snd(660,.07);setTimeout(()=>snd(990,.09),60)},hit:()=>snd(160,.12,'sawtooth',.09,-90),pop:()=>{snd(240,.25,'sawtooth',.1,-190);snd(900,.1,'square',.04,-600)},
  ui:()=>snd(520,.05,'triangle',.06),bad:()=>snd(140,.3,'sawtooth',.08,-80),ok:()=>{[523,659,784,1046].forEach((f,i)=>setTimeout(()=>snd(f,.14,'triangle',.07),i*90))},ding:()=>{snd(1320,.12,'sine',.08);setTimeout(()=>snd(1760,.2,'sine',.08),110)},pedal:()=>snd(300+Math.random()*80,.04,'triangle',.05)};

/* ---------- 상태 ---------- */
const G={money:37000,stars:0,hp:100,ch:0,ammo:0,nade:0,shake:0,flash:0,toasts:[],sub:null,banner:null,card:null,parts:[],stats:{ko:0,fails:0,t:0},m0:37000};
let mode='title',L=null,D=null,T=0,failMsg='',clearInfo=null,titleSel=0,unlocked=0;
try{unlocked=+(localStorage.getItem('halmae_ch')||0)||0}catch(e){}
const P={x:0,y:0,a:0,r:13,veh:null,walk:0,atk:0,inv:0};
const Mal={x:0,y:0,a:0,walk:0,active:false,cd:0};
const cam={x:0,y:0};
const toast=(s,col)=>{G.toasts.push({s,t:3.6,col});if(G.toasts.length>4)G.toasts.shift()};
const sub=(s,t=3)=>{G.sub={s,t}};
const banner=(small,big,t=3.2)=>{G.banner={small,big,t,t0:t}};
const card=(k,desc,t=3.2)=>{G.card={k,desc,t,t0:t}};
function part(x,y,o){G.parts.push(Object.assign({x,y,vx:0,vy:0,life:.6,l0:0,size:5,col:'#fff'},o));const p=G.parts[G.parts.length-1];p.l0=p.life}
function burst(x,y,n,col,sp=200,size=5,life=.6){for(let i=0;i<n;i++){const a=rnd(0,TAU),s=rnd(sp*.3,sp);part(x,y,{vx:Math.cos(a)*s,vy:Math.sin(a)*s,col:Array.isArray(col)?col[i%col.length]:col,size:rnd(size*.5,size),life:rnd(life*.5,life)})}}
function say(lines,then){D={lines,i:0,ch:0,then};S.ui()}
function hurt(d,msg){if(P.inv>0||mode!=='play')return;G.hp-=d;P.inv=.6;G.shake=10;G.flash=.25;S.hit();if(G.hp<=0){G.hp=0;fail(msg||L.fail||'허리가 나갔습니다')}}
function fail(msg){if(mode==='fail')return;mode='fail';failMsg=msg;G.stats.fails++;T=0;S.bad()}
function clear(reward,msg){mode='clear';clearInfo={reward,msg};G.money+=reward;T=0;S.ok();if(G.ch+1>unlocked){unlocked=Math.min(4,G.ch+1);try{localStorage.setItem('halmae_ch',unlocked)}catch(e){}}}

/* ---------- 인물 ---------- */
const ST={
 sunja:{body:'#c9a0c8',vest:'#a8669a',glove:'#e0312b',hair:'perm',hc:'#d2d2da',name:'순자',col:'#ffa8d6',old:1},
 malsun:{body:'#8e2b3a',vest:'#70202c',glove:'#e9bd94',hair:'visor',hc:'#5a5a5a',name:'말순',col:'#ff8080',old:1,glasses:1},
 ijang:{body:'#566b4a',vest:'#3c4f35',glove:'#e9bd94',hair:'bald',hc:'#b5b5b5',name:'이장님',col:'#a8e66b',old:1},
 gramps:{body:'#8a5a33',vest:'#6d4424',glove:'#e9bd94',hair:'short',hc:'#c4c4c4',name:'옆집 영감',col:'#e6b877',old:1},
 youth:{body:'#e6d23a',vest:'#c9b520',glove:'#e9bd94',hair:'cap',hc:'#f2d21f',name:'청년회',col:'#f2d21f'},
 guard:{body:'#7fb0e6',vest:'#5c8fc9',glove:'#e9bd94',hair:'cap',hc:'#1d2a4d',name:'경비',col:'#8fc0ff'},
 police:{body:'#d7f23a',vest:'#1d2a4d',glove:'#e9bd94',hair:'cap',hc:'#1d2a4d',name:'경찰',col:'#8fd0ff'},
 rider:{body:'#2b2b2b',vest:'#111',glove:'#e9bd94',hair:'cap',hc:'#111',name:'배달 기사',col:'#ddd'},
 worker:{body:'#9aa0a6',vest:'#868c92',glove:'#e9bd94',hair:'short',hc:'#222',name:'직원',col:'#ccc'},
 minjun:{body:'#b3b8bd',vest:'#9aa0a6',glove:'#e9bd94',hair:'short',hc:'#1a1a1a',glasses:1,name:'민준 (손주)',col:'#ffd23f'},
 boss:{body:'#2b3350',vest:'#1d2440',glove:'#e9bd94',hair:'short',hc:'#151515',name:'최 부장',col:'#cf7bff'},
 suit:{body:'#15171c',vest:'#0c0d10',glove:'#e9bd94',hair:'short',hc:'#111',name:'???',col:'#fff'},
};
function drawPerson(x,y,a,k,walk,o={}){const st=ST[k];c.save();c.translate(x,y);
  c.fillStyle='rgba(0,0,0,.25)';c.beginPath();c.ellipse(3,5,15,13,0,0,TAU);c.fill();
  if(o.ko){c.rotate(a+1.2);c.scale(1.15,1.15);c.fillStyle=st.body;c.beginPath();c.ellipse(-10,0,20,11,0,0,TAU);c.fill();c.fillStyle='#e9bd94';circ(12,0,9);hairTop(st,12,0);c.restore();
    for(let i=0;i<3;i++){const aa=T*5+i*2.1;txt('★',x+Math.cos(aa)*16,y-18+Math.sin(aa)*5,12,COL.gold,'center')}return}
  c.rotate(a);c.scale(1.2,1.2);const sw=Math.sin(walk*12)*5;
  c.fillStyle=st.glove;if(o.atk>0){circ(20,-6,5.5);circ(16,9,5)}else{circ(5+sw,-13,4.5);circ(5-sw,13,4.5)}
  c.fillStyle=st.body;c.beginPath();c.ellipse(0,0,9.5,13.5,0,0,TAU);c.fill();
  c.fillStyle=st.vest;c.beginPath();c.ellipse(-2,0,7,11,0,0,TAU);c.fill();
  c.fillStyle='#e9bd94';circ(2,0,8);hairTop(st,2,0);c.restore()}
function hairTop(st,x,y){
  if(st.hair==='perm'){c.fillStyle=st.hc;for(let i=0;i<7;i++){const a=PI*.55+i*PI*.15;circ(x+Math.cos(a)*5.5,y+Math.sin(a)*5.5,4.3)}circ(x-1,y,5)}
  else if(st.hair==='visor'){c.fillStyle=st.hc;circ(x-2,y,6.5);c.fillStyle='#fff';c.beginPath();c.ellipse(x+7,y,6,9.5,0,-PI/2,PI/2);c.fill();c.fillRect(x+3,y-8.5,3,17)}
  else if(st.hair==='bald'){c.fillStyle='rgba(255,255,255,.45)';circ(x-2,y-3,2.5);c.fillStyle=st.hc;circ(x-6,y-5,2.2);circ(x-6,y+5,2.2)}
  else if(st.hair==='cap'){c.fillStyle=st.hc;circ(x,y,8);c.beginPath();c.ellipse(x+8,y,5,7,0,-PI/2,PI/2);c.fill()}
  else{c.fillStyle=st.hc;circ(x-1.5,y,7)}}
function face(k,x,y,s,mood){const st=ST[k];c.save();c.translate(x,y);c.scale(s/30,s/30);
  if(st.hair==='perm'){c.fillStyle=st.hc;for(let i=0;i<11;i++){const a=PI*.92+i*PI*1.16/10;circ(Math.cos(a)*29,Math.sin(a)*27-3,12)}}
  if(st.hair==='visor'){c.fillStyle=st.hc;c.beginPath();c.arc(0,-3,32,PI*.95,PI*.05);c.fill()}
  c.fillStyle='#e9bd94';circ(0,0,30);
  if(st.hair==='short'){c.fillStyle=st.hc;c.beginPath();c.arc(0,-3,31,PI*1.04,PI*1.96);c.closePath();c.fill()}
  if(st.hair==='bald'){c.fillStyle=st.hc;circ(-29,0,7);circ(29,0,7);c.fillStyle='rgba(255,255,255,.4)';circ(-9,-19,6)}
  if(st.hair==='cap'){c.fillStyle=st.hc;c.beginPath();c.arc(0,-6,32,PI,0);c.fill();rr(-38,-12,76,9,4);c.fill()}
  if(st.hair==='visor'){c.fillStyle='#fff';rr(-32,-22,64,11,4);c.fill();c.beginPath();c.ellipse(0,-12,42,9,0,0,PI);c.fill()}
  c.strokeStyle='#3a2518';c.lineWidth=2.6;c.lineCap='round';c.fillStyle='#2a1c14';
  if(mood==='ko'){line(-15,-3,-7,5);line(-7,-3,-15,5);line(15,-3,7,5);line(7,-3,15,5)}else{circ(-11,2,3.2);circ(11,2,3.2)}
  if(mood==='angry'||k==='sunja'||k==='boss'){line(-18,-9,-5,-4);line(18,-9,5,-4)}else{line(-17,-7,-6,-8);line(17,-7,6,-8)}
  if(st.glasses){c.lineWidth=2;c.strokeStyle='#222';ring(-11,2,8.5);ring(11,2,8.5);line(-2.5,2,2.5,2)}
  c.strokeStyle='#7a3b2a';c.lineWidth=2.6;c.beginPath();
  if(mood==='happy')c.arc(0,10,8,.15*PI,.85*PI);else if(mood==='angry'){c.arc(0,20,8,1.2*PI,1.8*PI)}else if(mood==='ko'){c.ellipse(0,15,5,6,0,0,TAU)}else{c.moveTo(-6,15);c.lineTo(6,15)}c.stroke();
  if(st.old){c.strokeStyle='rgba(120,70,40,.4)';c.lineWidth=1.5;line(-20,10,-16,16);line(20,10,16,16);line(-8,-16,8,-16)}
  c.restore()}
function cabbage(x,y,s=1){c.save();c.translate(x,y);c.scale(s,s);c.fillStyle='rgba(0,0,0,.2)';c.beginPath();c.ellipse(2,4,13,9,0,0,TAU);c.fill();
  c.fillStyle='#8fc24a';c.beginPath();c.ellipse(0,0,13,10,0,0,TAU);c.fill();c.fillStyle='#cfe88a';c.beginPath();c.ellipse(-1,0,9,7.5,0,0,TAU);c.fill();
  c.fillStyle='#f4f8dc';c.beginPath();c.ellipse(-2,0,4.5,5,0,0,TAU);c.fill();c.strokeStyle='#7fb03c';c.lineWidth=1;line(-8,-3,6,-5);line(-8,3,6,5);c.restore()}

/* ---------- 탈것 ---------- */
const VS={truck:{r:26,maxSp:460,acc:430,turn:2.7},wtruck:{r:26,maxSp:508,acc:380,turn:2.3},tractor:{r:22,maxSp:70,acc:100,turn:1},
  scooter:{r:15,maxSp:400,acc:520,turn:4.4},swan:{r:26,maxSp:430,acc:0,turn:2.8},pcar:{r:24,maxSp:325,acc:300,turn:2.5},pboat:{r:24,maxSp:262,acc:210,turn:2.1},car:{r:24,maxSp:150,acc:200,turn:0}};
function car(x,y,a,kind,o){return Object.assign({t:'car',layer:1,x,y,a,kind,sp:0,cd:0,hitcd:0,hp:1,ko:0,col:'#c33'},VS[kind],o)}
function drawVeh(v){c.save();c.translate(v.x,v.y);c.rotate(v.a+(v.ko>0?(2.5-v.ko)*9:0));const k=v.kind;
  c.fillStyle='rgba(0,0,0,.28)';
  if(k==='truck'||k==='wtruck'){rr(-44,-18,96,44,6);c.fill();c.fillStyle='#111';c.fillRect(-34,-25,16,50);c.fillRect(22,-25,14,50);
    const body=k==='truck'?'#2f5fa8':'#f1f1ee',dark=k==='truck'?'#234a86':'#cfcfca';
    c.fillStyle=dark;rr(-48,-22,60,44,3);c.fill();c.fillStyle=k==='truck'?'#3a4a5c':'#b9b9b2';c.fillRect(-44,-18,52,36);
    if(k==='truck'){for(let i=0;i<5;i++)cabbage(-36+(i%3)*14,-8+(i>2?14:0)+(i%2)*3,.7)}
    c.fillStyle=body;rr(12,-22,36,44,6);c.fill();c.fillStyle='#9fd3ea';rr(34,-18,9,36,3);c.fill();
    c.fillStyle='#ffe98a';c.fillRect(46,-19,3,7);c.fillRect(46,12,3,7);
    if(k==='wtruck'){c.fillStyle='#f2d21f';circ(-30,-8,7);circ(-18,8,7);if(v.boss){c.fillStyle='#e9bd94';circ(-4,0,8);c.fillStyle='rgba(255,255,255,.5)';circ(-6,-2,2.5)}}
    else if(v===P.veh){c.fillStyle='#d2d2da';circ(24,-9,7);c.fillStyle='#fff';circ(24,9,7);c.fillStyle='#5a5a5a';circ(22,9,5)}}
  else if(k==='tractor'){rr(-24,-14,52,34,5);c.fill();c.fillStyle='#111';c.fillRect(-26,-22,20,44);c.fillRect(12,-17,10,34);c.fillStyle='#c23a2b';rr(-16,-13,42,26,4);c.fill();c.fillStyle='#8a2a20';c.fillRect(8,-10,14,20);c.fillStyle='#e9bd94';circ(-8,0,7);c.fillStyle='#d9c08a';circ(-8,0,5)}
  else if(k==='scooter'){c.beginPath();c.ellipse(3,4,24,10,0,0,TAU);c.fill();c.fillStyle='#111';c.fillRect(-24,-3,10,6);c.fillRect(16,-3,10,6);c.fillStyle='#f4f4f4';rr(-18,-7,38,14,6);c.fill();
    c.fillStyle='#d6352b';rr(-28,-11,16,22,3);c.fill();txt('배달',-20,0,7,'#fff','center');c.fillStyle='#333';c.fillRect(14,-12,3,24);
    if(v===P.veh){c.fillStyle='#fff';circ(-9,0,6.5);c.fillStyle='#d2d2da';circ(3,0,7)}}

function pushOut(o,r){let hit=false;for(const s of L.solids){if(o.x+r<s.x||o.x-r>s.x+s.w||o.y+r<s.y||o.y-r>s.y+s.h)continue;
    const cx=clamp(o.x,s.x,s.x+s.w),cy=clamp(o.y,s.y,s.y+s.h),dx=o.x-cx,dy=o.y-cy,d=Math.hypot(dx,dy);
    if(d<r){if(d<.001){const l=o.x-s.x,ri=s.x+s.w-o.x,t=o.y-s.y,b=s.y+s.h-o.y,m=Math.min(l,ri,t,b);if(m===l)o.x=s.x-r;else if(m===ri)o.x=s.x+s.w+r;else if(m===t)o.y=s.y-r;else o.y=s.y+s.h+r}else{o.x=cx+dx/d*r;o.y=cy+dy/d*r}hit=true}}
  if(o.x<r){o.x=r;hit=true}if(o.x>L.W-r){o.x=L.W-r;hit=true}if(o.y<r){o.y=r}if(o.y>L.H-r){o.y=L.H-r;hit=true}return hit}
function inSolid(x,y){for(const s of L.solids)if(x>s.x&&x<s.x+s.w&&y>s.y&&y<s.y+s.h)return true;return false}

/* ---------- 엔티티 ---------- */
function pickup(x,y,kind,get){return{t:'pick',layer:0,x,y,r:20,kind,get}}
function npc(x,y,k,o){return Object.assign({t:'npc',layer:2,x,y,a:rnd(0,TAU),r:13,k,hp:1,sp:70,see:250,pts:null,pi:0,ko:0,walk:0,cd:0,alert:0},o)}
function goTo(n,x,y,sp,dt){const dx=x-n.x,dy=y-n.y,d=Math.hypot(dx,dy);if(d>2){n.a=Math.atan2(dy,dx);n.x+=dx/d*sp*dt;n.y+=dy/d*sp*dt;n.walk+=dt*sp/90;pushOut(n,n.r)}return d}
function sees(n){const t=P.veh||P,d=dist(n,t);return d<n.see&&Math.abs(angd(Math.atan2(t.y-n.y,t.x-n.x),n.a))<1.05&&los(n,t)}
function patrol(n,dt){if(!n.pts)return;const p=n.pts[n.pi];if(goTo(n,p[0],p[1],n.sp,dt)<8)n.pi=(n.pi+1)%n.pts.length}
function shoot(x,y,a,kind,from,dmg,sp,o){L.projs.push(Object.assign({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,kind,from,dmg,life:2.2,r:7,rot:rnd(0,TAU)},o))}
function aimDir(){let best=null,bd=560;for(const e of L.ents){if(!e.hostile||e.ko>0||e.dead)continue;const d=dist(P,e);if(d<bd&&Math.abs(angd(Math.atan2(e.y-P.y,e.x-P.x),P.a))<1.25&&los(P,e)){bd=d;best=e}}return best?Math.atan2(best.y-P.y,best.x-P.x):P.a}
function attack(){P.atk=.22;
  if(G.nade>0){G.nade--;const a=aimDir();shoot(P.x,P.y,a,'nade','p',22,380,{life:.75,r:12});snd(300,.15,'triangle',.06,200);return}
  if(G.ammo>0){G.ammo--;const a=aimDir();shoot(P.x+Math.cos(a)*14,P.y+Math.sin(a)*14,a,'egg','p',5,520);snd(700,.06,'triangle',.05,300);return}
  snd(220,.07,'square',.05,-100);let any=false;
  for(const e of L.ents){if((e.t!=='npc'&&e.t!=='boss')||e.ko>0||e.dead||!e.hit)continue;const d=dist(P,e);if(d<52&&Math.abs(angd(Math.atan2(e.y-P.y,e.x-P.x),P.a))<1.3){e.hit(3,'slap');any=true}}
  if(any){G.shake=7;S.hit();burst(P.x+Math.cos(P.a)*26,P.y+Math.sin(P.a)*26,8,['#fff',COL.kim],160,5,.3)}}
function moveVeh(v,dt,isP){const ox=v.x,oy=v.y;v.x+=Math.cos(v.a)*v.sp*dt;v.y+=Math.sin(v.a)*v.sp*dt;v.hitcd-=dt;
  if(L.block&&L.block(v)){v.x=ox;v.y=oy;v.sp*=-.25;return true}
  const h=pushOut(v,v.r);if(h){const imp=Math.abs(v.sp);v.sp*=.6;if(isP&&imp>230&&v.hitcd<=0){v.hitcd=.7;hurt(7);burst(v.x,v.y,8,'#ddd',180)}}return h}
function aiChase(v,dt){if(v.ko>0){v.ko-=dt;v.x+=Math.cos(v.a)*v.sp*dt;v.y+=Math.sin(v.a)*v.sp*dt;v.sp*=.96;if(Math.random()<.5)part(v.x,v.y,{vy:-40,col:'rgba(60,60,60,.6)',size:12,life:.7});if(v.ko<=0)v.dead=true;return}
  const t=P.veh||P,ta=Math.atan2(t.y-v.y,t.x-v.x);v.a+=clamp(angd(ta,v.a),-v.turn*dt,v.turn*dt);
  const max=v.maxSp*(L.terr?L.terr(v):1);v.sp+=v.acc*dt;if(v.sp>max)v.sp=lerp(v.sp,max,.1);moveVeh(v,dt,false);v.cd-=dt;
  if(dist(v,t)<v.r+(t.r||13)+3&&v.cd<=0){v.cd=1.7;hurt(v.dmg||8);v.sp*=-.5;if(P.veh)P.veh.sp*=.55;burst(t.x,t.y,10,['#fff','#ffd23f'],220)}
  if(dist(v,t)>(v.far||1500))v.dead=true}
function koCar(v){v.ko=2.5;v.sp=Math.max(v.sp,200);G.stats.ko++;burst(v.x,v.y,16,['#fff','#ffd23f','#888'],260,8,.8);G.shake=10}

/* ---------- 플레이어 갱신 ---------- */
function updPlayer(dt){const ax=axis();P.inv-=dt;P.atk-=dt;
  if(P.veh){const v=P.veh;let thr=0;
    if(ax.m>.2){const ta=Math.atan2(ax.y,ax.x);const tr=v.turn*(0.55+0.45*clamp(Math.abs(v.sp)/200,0,1));v.a+=clamp(angd(ta,v.a),-tr*dt,tr*dt);thr=1}
    const max=v.maxSp*(L.terr?L.terr(v):1);
    if(v.kind==='swan'){if(thr)v.sp=Math.max(v.sp,34);if(jp.a){v.sp=Math.min(max,v.sp+78);S.pedal();burst(v.x-Math.cos(v.a)*30,v.y-Math.sin(v.a)*30,3,'rgba(255,255,255,.7)',90,6,.5)}v.sp-=v.sp*1.25*dt}
    else{v.sp+=thr*v.acc*dt;v.sp-=v.sp*(thr?.5:1.9)*dt;if(v.sp>max)v.sp=lerp(v.sp,max,.08);if(key.b&&v.sp>0)v.sp-=v.sp*3*dt;if(jp.a&&L.fire)L.fire()}
    moveVeh(v,dt,true);P.x=v.x;P.y=v.y;P.a=v.a;
    for(const e of L.ents){if(e===v||e.dead)continue;
      if(e.t==='bale'&&dist(e,v)<v.r+e.r){e.dead=true;v.sp*=.8;burst(e.x,e.y,12,e.col||'#fff',240,9,.7);snd(120,.1,'triangle',.07);if(e.msg)toast(e.msg)}
      if(e.t==='car'&&e.ai==='traffic'&&dist(e,v)<v.r+e.r&&v.hitcd<=0){v.hitcd=.8;v.sp*=-.4;hurt(8);burst(v.x,v.y,10,'#ddd',200)}}}
  else{const sp=175*(key.b?1.5:1);const ox=P.x,oy=P.y;
    if(ax.m>.15){P.x+=ax.x*sp*dt;P.y+=ax.y*sp*dt;P.a=Math.atan2(ax.y,ax.x);P.walk+=dt*sp/90}
    if(L.block&&L.block(P)){P.x=ox;P.y=oy}pushOut(P,13);
    if(jp.a)attack();
    if(jp.e){for(const e of L.ents)if(e.t==='car'&&e.enter&&dist(P,e)<(e.er||78)){P.veh=e;e.enter=false;S.pick();if(L.onEnter)L.onEnter(e);break}}}
  for(const e of L.ents){if(e.t==='pick'&&!e.dead&&dist(e,P)<e.r+(P.veh?P.veh.r:14)){e.dead=true;S.pick();burst(e.x,e.y,8,[COL.gold,'#fff'],140,4,.4);e.get(e)}}
  if(Mal.active&&!P.veh){const tx=P.x-Math.cos(P.a)*34+Math.sin(P.a)*14,ty=P.y-Math.sin(P.a)*34-Math.cos(P.a)*14,d=Math.hypot(tx-Mal.x,ty-Mal.y);
    if(d>300){Mal.x=tx;Mal.y=ty}else if(d>10){Mal.a=Math.atan2(ty-Mal.y,tx-Mal.x);const s=Math.min(d*4,280);Mal.x+=Math.cos(Mal.a)*s*dt;Mal.y+=Math.sin(Mal.a)*s*dt;Mal.walk+=dt*s/90;pushOut(Mal,12)}
    Mal.cd-=dt;if(L.malFight&&Mal.cd<=0){let best=null,bd=420;for(const e of L.ents){if(!e.hostile||e.ko>0||e.dead)continue;if(e.t==='npc'&&e.alert<=0)continue;const dd=dist(Mal,e);if(dd<bd&&los(Mal,e)){bd=dd;best=e}}
      if(best){Mal.cd=1.7;Mal.a=Math.atan2(best.y-Mal.y,best.x-Mal.x);shoot(Mal.x,Mal.y,Mal.a,'spud','p',4,460)}}}}

function updWorld(dt){
  updPlayer(dt);if(mode!=='play')return;
  for(const e of L.ents){if(e.dead)continue;
    if(e.t==='npc'){if(e.ko>0){e.ko-=dt;if(e.ko<=0&&!e.revive)e.ko=1e9;continue}if(e.ai)e.ai(e,dt)}
    else if(e.t==='boss')e.ai(e,dt);
    else if(e.t==='car'){if(e.ai==='chase')aiChase(e,dt);else if(e.ai==='traffic'){e.x+=Math.cos(e.a)*e.spd*dt;e.y+=Math.sin(e.a)*e.spd*dt;if(e.wrap)e.wrap(e)}else if(e.ai==='slow'&&e.upd)e.upd(e,dt)}
    else if(e.t==='chick'){e.tm-=dt;if(e.tm<=0){e.tm=rnd(.4,1.4);e.a=rnd(0,TAU)}e.x+=Math.cos(e.a)*30*dt;e.y+=Math.sin(e.a)*30*dt}}
